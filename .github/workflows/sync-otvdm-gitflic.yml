name: Sync otvdm to GitFlic

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sync repository
        uses: actions/checkout@v4

      - name: Mirror otya128/winevdm Git history to GitFlic
        env:
          GITFLIC_USER: ${{ secrets.GITFLIC_USER }}
          GITFLIC_TRANSPORT_TOKEN: ${{ secrets.GITFLIC_TRANSPORT_TOKEN }}
        run: |
          git clone --mirror https://github.com/otya128/winevdm.git winevdm.git
          cd winevdm.git
          git push --mirror "https://${GITFLIC_USER}:${GITFLIC_TRANSPORT_TOKEN}@gitflic.ru/starware/otvdm.git"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Sync latest AppVeyor build to GitFlic Releases
        env:
          GITFLIC_API_TOKEN: ${{ secrets.GITFLIC_API_TOKEN }}
          GITFLIC_OWNER: starware
          GITFLIC_PROJECT: otvdm
        run: python sync_otvdm_to_gitflic.py
